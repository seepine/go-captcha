# 镜像仓库配置
#   变量 DOCKER_REGISTRY,DOCKER_USERNAME
#   密钥 DOCKER_PASSWORD

name: Release

on:
  push:
    tags:
      - v*

jobs:
  release-image:
    runs-on: ubuntu-latest
    if: ${{ vars.DOCKER_REGISTRY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Docker build push
        uses: seepine/action-docker-build-push@v1
        with:
          file: Dockerfile
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          platforms: linux/amd64,linux/arm64

  release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build and Package
        run: |
          mkdir -p dist
          targets=("linux/amd64" "linux/arm64" "windows/amd64" "darwin/amd64" "darwin/arm64")

          for target in "${targets[@]}"; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" == "windows" ]; then ext=".exe"; fi

            filename="go-captcha_${os}_${arch}${ext}"
            echo "Building $target..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags "-s -w" -o "dist/$filename" .

            cd dist
            if [ "$os" == "windows" ]; then
              zip "go-captcha_${os}_${arch}.zip" "$filename"
            else
              tar -czf "go-captcha_${os}_${arch}.tar.gz" "$filename"
            fi
            rm "$filename"
            cd ..
          done

      - name: Release product
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
